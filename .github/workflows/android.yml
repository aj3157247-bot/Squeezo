name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d android/app ]]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Fix Android 36 and Media3 build
        shell: bash
        run: |
          set -euo pipefail
          APP="android/app/build.gradle"
          ROOT="android/build.gradle"
          ROOT_KTS="android/build.gradle.kts"

          test -f "$APP"

          # Android 16 / API 36 requires AGP 8.9.1 or newer.
          if [[ -f "$ROOT" ]]; then
            sed -i -E \
              -e "s/com\.android\.application' version '[0-9]+\.[0-9]+\.[0-9]+'/com.android.application' version '8.9.1'/g" \
              -e 's/com\.android\.application" version "[0-9]+\.[0-9]+\.[0-9]+"/com.android.application" version "8.9.1"/g' \
              -e "s/com\.android\.library' version '[0-9]+\.[0-9]+\.[0-9]+'/com.android.library' version '8.9.1'/g" \
              -e 's/com\.android\.library" version "[0-9]+\.[0-9]+\.[0-9]+"/com.android.library" version "8.9.1"/g' \
              -e 's/com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+/com.android.tools.build:gradle:8.9.1/g' \
              "$ROOT" || true
          fi

          if [[ -f "$ROOT_KTS" ]]; then
            sed -i -E \
              -e 's/id\("com\.android\.application"\) version "[0-9]+\.[0-9]+\.[0-9]+"/id("com.android.application") version "8.9.1"/g' \
              -e 's/id\("com\.android\.library"\) version "[0-9]+\.[0-9]+\.[0-9]+"/id("com.android.library") version "8.9.1"/g' \
              "$ROOT_KTS" || true
          fi

          python3 - "$APP" <<'PY'
import re, sys
p = sys.argv[1]
s = open(p, encoding='utf-8').read()
s = re.sub(r'compileSdk(?:Version)?\s*[= ]\s*\d+', 'compileSdk 36', s)
if 'compileSdk 36' not in s:
    s = re.sub(r'(android\s*\{)', r'\1\n    compileSdk 36', s, count=1)
s = re.sub(r'targetSdk(?:Version)?\s*[= ]\s*\d+', 'targetSdk 36', s)
s = re.sub(r'^\s*buildToolsVersion\s+[^\n]+\n', '', s, flags=re.M)

deps = '''\n    implementation "androidx.media3:media3-transformer:1.10.1"\n    implementation "androidx.media3:media3-effect:1.10.1"\n    implementation "androidx.media3:media3-common:1.10.1"\n'''
if 'androidx.media3:media3-transformer' not in s:
    if 'dependencies {' not in s:
        raise SystemExit('dependencies block not found')
    s = s.replace('dependencies {', 'dependencies {' + deps, 1)
open(p, 'w', encoding='utf-8').write(s)
PY

          # AGP 8.9.x uses Gradle 8.11.1.
          if [[ -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
            sed -i -E 's#gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-#gradle-8.11.1-#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Apply Squeezo native video engine
        shell: bash
        run: |
          set -euo pipefail
          APP="android/app"
          PKG="$APP/src/main/java/com/squeezo/app"
          XML="$APP/src/main/res/xml"
          mkdir -p "$PKG" "$XML"

          if [[ -f native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java ]]; then
            SRC="native/android"
          elif [[ -f native/native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java ]]; then
            SRC="native/native/android"
          else
            echo "ERROR: SqueezoVideoCompressorPlugin.java not found"
            find native -maxdepth 8 -type f | sort || true
            exit 1
          fi

          cp "$SRC/com/squeezo/app/SqueezoVideoCompressorPlugin.java" "$PKG/SqueezoVideoCompressorPlugin.java"
          [[ -f "$SRC/com/squeezo/app/MainActivity.java" ]] && cp "$SRC/com/squeezo/app/MainActivity.java" "$PKG/MainActivity.java"
          cp "$SRC/res/xml/file_paths.xml" "$XML/file_paths.xml"

          python3 - "android/app/src/main/AndroidManifest.xml" <<'PY'
import sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
if 'androidx.core.content.FileProvider' not in s:
    provider='''\n        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths" />\n        </provider>'''
    if '</application>' not in s:
        raise SystemExit('</application> not found')
    s=s.replace('</application>',provider+'\n    </application>',1)
    open(p,'w',encoding='utf-8').write(s)
PY

      - name: Verify
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/java/com/squeezo/app/SqueezoVideoCompressorPlugin.java
          test -f android/app/src/main/res/xml/file_paths.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
