name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f native/apply-android.sh
          test -f native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java
          test -f native/android/com/squeezo/app/MainActivity.java
          test -f native/android/res/xml/file_paths.xml
          bash -n native/apply-android.sh
          echo "Repository layout OK"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

      - name: Apply native Squeezo engine and API 36 configuration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/apply-android.sh
          ./native/apply-android.sh

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/variables.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/java/com/squeezo/app/SqueezoVideoCompressorPlugin.java
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36|compileSdk[[:space:]]+36' android/variables.gradle android/app/build.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36|targetSdk[[:space:]]+36' android/variables.gradle android/app/build.gradle
          grep -R -q '8.10.0' android/build.gradle android/settings.gradle 2>/dev/null || true
          grep -q 'gradle-8.11.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'media3-transformer:1.10.1' android/app/build.gradle
          echo 'Android project verification OK'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Print Gradle diagnostics
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          echo '--- SDK configuration ---'
          grep -R -E 'compileSdk|targetSdk' variables.gradle app/build.gradle || true
          echo '--- Media3 ---'
          grep 'androidx.media3:' app/build.gradle || true
          echo '--- AGP declarations ---'
          grep -R -E 'com\.android\.tools\.build:gradle|com\.android\.(application|library).*version' build.gradle settings.gradle settings.gradle.kts 2>/dev/null || true

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/squeezo-gradle.log"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-gradle-log
          path: ${{ runner.temp }}/squeezo-gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
