name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f native/apply-android.sh
          test -f native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java
          test -f native/android/com/squeezo/app/MainActivity.java
          test -f native/android/res/xml/file_paths.xml
          bash -n native/apply-android.sh
          echo "Source tree OK"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

      - name: Apply native Squeezo engine
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/apply-android.sh
          ./native/apply-android.sh

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail
          echo '--- variables.gradle ---'
          cat android/variables.gradle
          echo '--- root build.gradle ---'
          cat android/build.gradle
          echo '--- app build.gradle ---'
          cat android/app/build.gradle
          echo '--- gradle wrapper ---'
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'compileSdkVersion = 36\|compileSdkVersion 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36\|targetSdkVersion 36' android/variables.gradle
          grep -q '8.10.0' android/build.gradle
          grep -q '8.11.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/java/com/squeezo/app/SqueezoVideoCompressorPlugin.java

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
