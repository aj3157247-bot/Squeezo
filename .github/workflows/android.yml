name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show project files
        shell: bash
        run: |
          set -eux
          echo "Workspace: $PWD"
          echo "=== ROOT ==="
          ls -la
          echo "=== NATIVE ==="
          if [ -d native ]; then
            find native -maxdepth 8 -type f | sort
          else
            echo "native directory does not exist"
          fi
          echo "=== WWW ==="
          if [ -d www ]; then
            find www -maxdepth 2 -type f | sort | head -100
          fi

      - name: Install npm dependencies
        shell: bash
        run: |
          set -eux

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          npm install --no-audit --no-fund

      - name: Verify Capacitor
        shell: bash
        run: |
          set -eux

          npx cap --version
          echo "=== Capacitor config ==="

          if [ -f capacitor.config.json ]; then
            cat capacitor.config.json
          elif [ -f capacitor.config.ts ]; then
            cat capacitor.config.ts
          else
            echo "ERROR: Capacitor config not found"
            exit 1
          fi

      - name: Prepare web assets
        shell: bash
        run: |
          set -eux

          if [ ! -d www ]; then
            echo "ERROR: www directory not found"
            exit 1
          fi

          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html not found"
            exit 1
          fi

          echo "Web assets are ready."

      - name: Add Android platform if needed
        shell: bash
        run: |
          set -eux

          if [ ! -d android ]; then
            echo "Android project does not exist."
            echo "Creating Android project..."

            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          set -eux

          npx cap sync android

      - name: Apply native Squeezo video engine
        shell: bash
        run: |
          set -eux

          if [ -f native/apply-android.sh ]; then
            echo "Found native/apply-android.sh"

            chmod +x native/apply-android.sh
            ./native/apply-android.sh
          else
            echo "native/apply-android.sh not found."
            echo "Continuing without native patch."
          fi

      - name: Verify Android project
        shell: bash
        run: |
          set -eux

          if [ ! -d android ]; then
            echo "ERROR: android directory was not created."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          echo "=== Android project ==="
          ls -la android

          echo "=== Gradle version ==="
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Configure Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed || true

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" || true

      - name: Set compile SDK to 36
        shell: bash
        run: |
          set -eux

          if [ ! -f android/app/build.gradle ]; then
            echo "ERROR: android/app/build.gradle not found"
            exit 1
          fi

          echo "=== BEFORE ==="
          grep -n -E "compileSdk|targetSdk|minSdk" android/app/build.gradle || true

          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' android/app/build.gradle
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' android/app/build.gradle

          echo "=== AFTER ==="
          grep -n -E "compileSdk|targetSdk|minSdk" android/app/build.gradle || true

      - name: Check Media3 dependencies
        shell: bash
        run: |
          set -eux

          echo "=== Media3 references ==="
          grep -Rni "androidx.media3" android/app android 2>/dev/null || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -eux

          cd android
          chmod +x gradlew

          echo "Starting Gradle build..."
          ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Find APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "=== APK FILES ==="

          if [ -d android ]; then
            find android -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: squeezo-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: squeezo-gradle-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
