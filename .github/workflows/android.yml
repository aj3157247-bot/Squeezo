name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm packages
        run: npm install --no-audit --no-fund

      - name: Create Android project if needed
        run: |
          set -e
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android API 36
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle")
          if not app.exists():
              raise SystemExit("ERROR: android/app/build.gradle not found")

          s = app.read_text()

          if re.search(r'compileSdk(?:Version)?\s+', s):
              s = re.sub(r'compileSdk(?:Version)?\s+\d+', 'compileSdk 36', s)
          else:
              s = s.replace('android {', 'android {\n    compileSdk 36', 1)

          if re.search(r'targetSdk(?:Version)?\s+', s):
              s = re.sub(r'targetSdk(?:Version)?\s+\d+', 'targetSdk 36', s)

          deps = '''
              implementation "androidx.media3:media3-transformer:1.10.1"
              implementation "androidx.media3:media3-effect:1.10.1"
              implementation "androidx.media3:media3-common:1.10.1"
          '''

          if "androidx.media3:media3-transformer" not in s:
              if "dependencies {" not in s:
                  raise SystemExit("ERROR: dependencies block not found")
              s = s.replace("dependencies {", "dependencies {" + deps, 1)

          app.write_text(s)

          root = Path("android/build.gradle")
          if root.exists():
              r = root.read_text()
              r = re.sub(
                  r'com\.android\.tools\.build:gradle:\d+\.\d+\.\d+',
                  'com.android.tools.build:gradle:8.9.1',
                  r
              )
              r = re.sub(
                  r"(com\.android\.application['"]?\s*version\s*['"])[0-9.]+(['"])",
                  r"\g<1>8.9.1\g<2>",
                  r
              )
              r = re.sub(
                  r"(com\.android\.library['"]?\s*version\s*['"])[0-9.]+(['"])",
                  r"\g<1>8.9.1\g<2>",
                  r
              )
              root.write_text(r)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              w = wrapper.read_text()
              w = re.sub(
                  r'gradle-[0-9.]+-all\.zip',
                  'gradle-8.11.1-all.zip',
                  w
              )
              wrapper.write_text(w)
          PY

      - name: Apply native video compressor
        run: |
          set -e

          if [ -f native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java ]; then
            SRC=native/android
          elif [ -f native/native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java ]; then
            SRC=native/native/android
          else
            echo "Native compressor source not found; continuing with web implementation."
            exit 0
          fi

          APP=android/app
          mkdir -p "$APP/src/main/java/com/squeezo/app"
          mkdir -p "$APP/src/main/res/xml"

          cp "$SRC/com/squeezo/app/SqueezoVideoCompressorPlugin.java"              "$APP/src/main/java/com/squeezo/app/SqueezoVideoCompressorPlugin.java"

          if [ -f "$SRC/com/squeezo/app/MainActivity.java" ]; then
            cp "$SRC/com/squeezo/app/MainActivity.java"                "$APP/src/main/java/com/squeezo/app/MainActivity.java"
          fi

          cp "$SRC/res/xml/file_paths.xml"              "$APP/src/main/res/xml/file_paths.xml"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          s = p.read_text()

          if "androidx.core.content.FileProvider" not in s:
              provider = '''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              '''
              s = s.replace("</application>", provider + "\n    </application>", 1)

          p.write_text(s)
          PY

      - name: Verify files
        run: |
          set -e
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project is ready."

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
