name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Verify repository layout
        shell: bash
        run: |
          set -e
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f native/apply-android.sh
          test -f native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java
          test -f native/android/com/squeezo/app/MainActivity.java
          test -f native/android/res/xml/file_paths.xml

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform
        run: npx cap add android

      - name: Apply native Squeezo video engine and Android 36 configuration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/apply-android.sh
          ./native/apply-android.sh
          echo "--- Effective SDK configuration ---"
          grep -R -E 'compileSdkVersion|targetSdkVersion|compileSdk|targetSdk' android/variables.gradle android/app/build.gradle 2>/dev/null || true
          grep -R 'androidx.media3:' android/app/build.gradle || true
          grep -R 'com.android.tools.build:gradle' android/build.gradle || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
