name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify project
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -d www
          test -f www/index.html
          rm -f capacitor.config.ts capacitor.config.js
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform
        run: npx cap add android

      - name: Apply native Squeezo video engine
        run: |
          chmod +x native/apply-android.sh
          ./native/apply-android.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
