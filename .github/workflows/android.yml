name: Build Squeezo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Squeezo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify repository layout
        shell: bash
        run: |
          set -e
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          echo "--- root ---"
          ls -la
          echo "--- native ---"
          ls -la native || true
          echo "--- native files ---"
          find native -maxdepth 6 -type f -print 2>/dev/null | sort || true

          test -f "$GITHUB_WORKSPACE/package.json"
          test -f "$GITHUB_WORKSPACE/capacitor.config.json"
          test -f "$GITHUB_WORKSPACE/www/index.html"
          test -f "$GITHUB_WORKSPACE/native/apply-android.sh"
          test -f "$GITHUB_WORKSPACE/native/android/com/squeezo/app/SqueezoVideoCompressorPlugin.java"
          test -f "$GITHUB_WORKSPACE/native/android/com/squeezo/app/MainActivity.java"
          test -f "$GITHUB_WORKSPACE/native/android/res/xml/file_paths.xml"

          rm -f "$GITHUB_WORKSPACE/capacitor.config.ts" "$GITHUB_WORKSPACE/capacitor.config.js"
          echo "Repository layout OK"

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform
        run: npx cap add android

      - name: Apply native Squeezo video engine
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          chmod +x native/apply-android.sh
          ./native/apply-android.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Squeezo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
